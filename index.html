<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bible Reading Plan 2027</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bible 2027">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans pb-10">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-500/10 p-2 rounded-xl border border-amber-500/20 text-amber-400">
        <i data-lucide="book-open" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-slate-100 leading-tight">Bible 2027</h1>
        <p class="text-xs text-slate-400">Daily Reading Tracker</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button id="open-settings-btn" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition-colors">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

    <!-- Overall Progress Card -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center text-sm">
        <div class="flex items-center space-x-2">
          <i data-lucide="flame" class="w-4 h-4 text-amber-500"></i>
          <span class="text-slate-300 font-medium"><span id="streak-count">0</span> Day Streak</span>
        </div>
        <span class="text-xs font-semibold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20" id="progress-percent">
          0% Completed
        </span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
        <div id="progress-bar-fill" class="bg-gradient-to-r from-amber-500 to-amber-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <div class="flex justify-between text-xs text-slate-400 font-medium">
        <span><strong id="completed-days-count" class="text-slate-200">0</strong> / 365 Days</span>
        <span><strong id="remaining-days-count" class="text-slate-200">365</strong> Days Left</span>
      </div>
    </section>

    <!-- Today / Selected Date Reading Card -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-amber-400" id="focus-label">Today's Reading</span>
          <h2 class="text-xl font-bold text-slate-100 flex items-center space-x-2" id="focus-date-str">
            <span>Jan 1, 2027</span>
          </h2>
        </div>
        <div class="flex items-center space-x-1">
          <button id="prev-day-btn" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <button id="today-btn" class="px-2.5 py-1 text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg">
            Today
          </button>
          <button id="next-day-btn" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Sub-Readings Checklist -->
      <div id="focus-items-list" class="space-y-2.5">
        <!-- Rendered dynamically -->
      </div>

      <!-- Master Action Button -->
      <div class="pt-2">
        <button id="toggle-all-btn" class="w-full py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center space-x-2 shadow-md bg-amber-500 hover:bg-amber-400 text-slate-950">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
          <span id="toggle-all-text">Mark All Readings Complete</span>
        </button>
      </div>
    </section>

    <!-- Monthly Calendar Section -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
      
      <!-- Calendar Controls -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center space-x-3">
          <h3 class="text-lg font-bold text-slate-100 flex items-center space-x-2">
            <i data-lucide="calendar" class="w-5 h-5 text-amber-400"></i>
            <span id="calendar-month-title">January 2027</span>
          </h3>
          <select id="month-select" class="bg-slate-800 text-xs font-medium text-slate-300 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-amber-500">
            <!-- 12 Months Options -->
          </select>
        </div>

        <div class="flex items-center justify-between sm:justify-end space-x-2">
          <div class="flex items-center space-x-1">
            <button id="cal-prev-month" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg border border-slate-800">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="cal-today-btn" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg border border-slate-800">
              Current Month
            </button>
            <button id="cal-next-month" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg border border-slate-800">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Days of Week Header -->
      <div class="grid grid-cols-7 text-center font-semibold text-xs text-slate-400 border-b border-slate-800 pb-2">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>

      <!-- Monthly Calendar Grid -->
      <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2">
        <!-- Calendar cells rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Settings / Google Sheets Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-slate-100 flex items-center space-x-2">
          <i data-lucide="database" class="w-5 h-5 text-amber-400"></i>
          <span>Google Sheets CSV Feed</span>
        </h3>
        <button id="close-settings-btn" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs text-slate-300">
        <div>
          <label class="block font-medium mb-1 text-slate-400">Published Google Sheet CSV URL</label>
          <input type="text" id="csv-url-input" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-xs">
          <p class="text-[11px] text-slate-500 mt-1">In Google Sheets: File > Share > Publish to web > CSV format.</p>
        </div>
      </div>

      <div class="pt-2 flex space-x-2">
        <button id="save-settings-btn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-colors">
          Save & Load Schedule
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- State Management ---
    let scheduleData = [];
    let activeDateStr = "2027-01-01";
    let calendarViewYear = 2027;
    let calendarViewMonth = 0; // 0 = Jan
    let sheetCsvUrl = localStorage.getItem("bible_2027_csv_url") || "";

    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    // --- Mock Fallback Schedule Generator ---
    function generateFallbackSchedule() {
      const schedule = [];
      let currentDate = new Date(2027, 0, 1);
      
      for (let dayNum = 1; dayNum <= 365; dayNum++) {
        const dateStr = currentDate.toISOString().split('T')[0];
        schedule.push({
          day: dayNum,
          date: dateStr,
          items: [
            { id: `d${dayNum}_1`, label: `Day ${dayNum} Passage 1`, done: false },
            { id: `d${dayNum}_2`, label: `Day ${dayNum} Passage 2`, done: false }
          ]
        });
        currentDate.setDate(currentDate.getDate() + 1);
      }
      return schedule;
    }

    // --- Fetch Schedule from Published Google Sheets CSV ---
    async function fetchScheduleFromCSV(url) {
      try {
        const response = await fetch(url);
        const csvText = await response.text();
        
        const lines = csvText.trim().split(/\r?\n/);
        const savedCompletions = JSON.parse(localStorage.getItem("bible_2027_completions") || "{}");

        const schedule = [];

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          
          // Parse CSV columns: Day, Date, Passage
          const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
          
          const dayNum = parseInt(cols[0], 10) || i;
          const dateStr = cols[1] || "";
          const rawPassage = cols[2] || "";

          // Splits multiple chapters or ranges (e.g. Genesis 1 & 2) into individual checkboxes
          const passageParts = rawPassage.split(/&|,/).map(p => p.trim());
          
          const items = passageParts.map((part, pIdx) => {
            const itemId = `d${dayNum}_p${pIdx + 1}`;
            return {
              id: itemId,
              label: part,
              done: !!savedCompletions[itemId]
            };
          });

          schedule.push({
            day: dayNum,
            date: dateStr,
            items: items
          });
        }

        return schedule;
      } catch (err) {
        console.error("Failed to fetch Google Sheets CSV:", err);
        return null;
      }
    }

    // --- App Initialization ---
    async function initApp() {
      document.getElementById("csv-url-input").value = sheetCsvUrl;

      if (sheetCsvUrl) {
        const fetchedSchedule = await fetchScheduleFromCSV(sheetCsvUrl);
        if (fetchedSchedule && fetchedSchedule.length > 0) {
          scheduleData = fetchedSchedule;
        } else {
          scheduleData = generateFallbackSchedule();
        }
      } else {
        scheduleData = generateFallbackSchedule();
      }

      // Default active date setup
      const todayISO = new Date().toISOString().split('T')[0];
      if (scheduleData.some(d => d.date === todayISO)) {
        activeDateStr = todayISO;
        calendarViewMonth = new Date().getMonth();
      } else {
        activeDateStr = scheduleData[0]?.date || "2027-01-01";
        calendarViewMonth = 0;
      }

      populateMonthDropdown();
      renderAll();
      setupEventListeners();
      lucide.createIcons();
    }

    function saveState() {
      // Save completions map locally
      const completions = {};
      scheduleData.forEach(day => {
        day.items.forEach(item => {
          if (item.done) completions[item.id] = true;
        });
      });

      localStorage.setItem("bible_2027_completions", JSON.stringify(completions));
      renderAll();
    }

    function populateMonthDropdown() {
      const select = document.getElementById("month-select");
      select.innerHTML = "";
      MONTH_NAMES.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = name;
        if (index === calendarViewMonth) option.selected = true;
        select.appendChild(option);
      });
    }

    // --- Rendering Functions ---
    function renderAll() {
      renderProgressStats();
      renderFocusCard();
      renderCalendar();
      lucide.createIcons();
    }

    function renderProgressStats() {
      let totalItems = 0;
      let completedItems = 0;
      let completedDays = 0;

      scheduleData.forEach(day => {
        const allDone = day.items.length > 0 && day.items.every(i => i.done);
        if (allDone) completedDays++;
        
        day.items.forEach(item => {
          totalItems++;
          if (item.done) completedItems++;
        });
      });

      const percent = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

      document.getElementById("progress-percent").textContent = `${percent}% Completed`;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;
      document.getElementById("completed-days-count").textContent = completedDays;
      document.getElementById("remaining-days-count").textContent = 365 - completedDays;
      document.getElementById("streak-count").textContent = completedDays;
    }

    function renderFocusCard() {
      const dayData = scheduleData.find(d => d.date === activeDateStr) || scheduleData[0];
      if (!dayData) return;

      const dateObj = new Date(dayData.date + "T00:00:00");
      const dateFormatted = isNaN(dateObj) 
        ? dayData.date 
        : dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', weekday: 'short' });

      document.getElementById("focus-date-str").textContent = dateFormatted;
      document.getElementById("focus-label").textContent = `Day ${dayData.day} Reading`;

      const listContainer = document.getElementById("focus-items-list");
      listContainer.innerHTML = "";

      const allDone = dayData.items.length > 0 && dayData.items.every(i => i.done);

      dayData.items.forEach((item) => {
        const itemEl = document.createElement("div");
        itemEl.className = `flex items-center justify-between p-3 rounded-xl border transition-all cursor-pointer ${
          item.done 
            ? 'bg-amber-500/10 border-amber-500/30 text-amber-200' 
            : 'bg-slate-800/60 border-slate-700/60 text-slate-200 hover:border-slate-600'
        }`;
        
        itemEl.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-5 h-5 rounded-md border flex items-center justify-center transition-colors ${
              item.done ? 'bg-amber-500 border-amber-500 text-slate-950' : 'border-slate-600 bg-slate-900'
            }">
              ${item.done ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
            </div>
            <span class="font-semibold text-sm ${item.done ? 'line-through text-slate-400' : ''}">${item.label}</span>
          </div>
        `;

        itemEl.addEventListener("click", () => {
          item.done = !item.done;
          if (dayData.items.every(i => i.done)) {
            triggerConfetti();
          }
          saveState();
        });

        listContainer.appendChild(itemEl);
      });

      const masterBtn = document.getElementById("toggle-all-btn");
      const masterText = document.getElementById("toggle-all-text");

      if (allDone) {
        masterBtn.className = "w-full py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center space-x-2 shadow-md bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700";
        masterText.textContent = "Mark Day as Unread";
      } else {
        masterBtn.className = "w-full py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center space-x-2 shadow-md bg-amber-500 hover:bg-amber-400 text-slate-950";
        masterText.textContent = "Mark All Chapters Complete";
      }
    }

    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";

      document.getElementById("calendar-month-title").textContent = `${MONTH_NAMES[calendarViewMonth]} ${calendarViewYear}`;
      document.getElementById("month-select").value = calendarViewMonth;

      const firstDay = new Date(calendarViewYear, calendarViewMonth, 1).getDay();
      const daysInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "min-h-[80px] bg-slate-950/40 border border-slate-800/40 rounded-xl p-1 opacity-30";
        grid.appendChild(emptyCell);
      }

      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const monthStr = String(calendarViewMonth + 1).padStart(2, '0');
        const dayStr = String(dayNum).padStart(2, '0');
        const dateKey = `${calendarViewYear}-${monthStr}-${dayStr}`;

        const dayData = scheduleData.find(d => d.date === dateKey);
        
        const cell = document.createElement("div");
        const isSelected = dateKey === activeDateStr;
        
        let doneCount = 0;
        let totalCount = 0;
        let isFullyComplete = false;

        if (dayData) {
          totalCount = dayData.items.length;
          doneCount = dayData.items.filter(i => i.done).length;
          isFullyComplete = totalCount > 0 && doneCount === totalCount;
        }

        let statusStyles = "bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700";
        if (isSelected) {
          statusStyles = "bg-slate-800 border-amber-500 ring-2 ring-amber-500/30 text-amber-300";
        } else if (isFullyComplete) {
          statusStyles = "bg-amber-500/10 border-amber-500/30 text-amber-200";
        } else if (doneCount > 0) {
          statusStyles = "bg-slate-800/80 border-sky-500/40 text-sky-200";
        }

        cell.className = `min-h-[80px] border rounded-xl p-1.5 flex flex-col justify-between transition-all cursor-pointer ${statusStyles}`;

        let itemsHTML = '';
        if (dayData) {
          dayData.items.forEach(item => {
            itemsHTML += `
              <div class="text-[10px] leading-tight px-1 py-0.5 rounded ${
                item.done ? 'bg-amber-500/20 text-amber-300 font-semibold line-through' : 'bg-slate-800 text-slate-400'
              } truncate">
                ${item.label}
              </div>
            `;
          });
        }

        cell.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold ${isSelected ? 'text-amber-400' : 'text-slate-200'}">${dayNum}</span>
            ${isFullyComplete ? '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-amber-400"></i>' : ''}
          </div>
          <div class="space-y-0.5 mt-1">
            ${itemsHTML}
          </div>
        `;

        cell.addEventListener("click", () => {
          activeDateStr = dateKey;
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        grid.appendChild(cell);
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
      }
    }

    // --- Event Listeners ---
    function setupEventListeners() {
      document.getElementById("prev-day-btn").addEventListener("click", () => {
        const idx = scheduleData.findIndex(d => d.date === activeDateStr);
        if (idx > 0) {
          activeDateStr = scheduleData[idx - 1].date;
          calendarViewMonth = new Date(activeDateStr + "T00:00:00").getMonth();
          renderAll();
        }
      });

      document.getElementById("next-day-btn").addEventListener("click", () => {
        const idx = scheduleData.findIndex(d => d.date === activeDateStr);
        if (idx < scheduleData.length - 1) {
          activeDateStr = scheduleData[idx + 1].date;
          calendarViewMonth = new Date(activeDateStr + "T00:00:00").getMonth();
          renderAll();
        }
      });

      document.getElementById("today-btn").addEventListener("click", () => {
        const todayISO = new Date().toISOString().split('T')[0];
        activeDateStr = scheduleData.some(d => d.date === todayISO) ? todayISO : scheduleData[0].date;
        calendarViewMonth = new Date(activeDateStr + "T00:00:00").getMonth();
        renderAll();
      });

      document.getElementById("toggle-all-btn").addEventListener("click", () => {
        const dayData = scheduleData.find(d => d.date === activeDateStr);
        if (dayData) {
          const allDone = dayData.items.every(i => i.done);
          dayData.items.forEach(i => i.done = !allDone);
          if (!allDone) triggerConfetti();
          saveState();
        }
      });

      document.getElementById("cal-prev-month").addEventListener("click", () => {
        if (calendarViewMonth > 0) {
          calendarViewMonth--;
        } else {
          calendarViewMonth = 11;
          calendarViewYear--;
        }
        renderAll();
      });

      document.getElementById("cal-next-month").addEventListener("click", () => {
        if (calendarViewMonth < 11) {
          calendarViewMonth++;
        } else {
          calendarViewMonth = 0;
          calendarViewYear++;
        }
        renderAll();
      });

      document.getElementById("cal-today-btn").addEventListener("click", () => {
        calendarViewYear = 2027;
        calendarViewMonth = 0;
        renderAll();
      });

      document.getElementById("month-select").addEventListener("change", (e) => {
        calendarViewMonth = parseInt(e.target.value, 10);
        renderAll();
      });

      // Settings Modal
      const modal = document.getElementById("settings-modal");
      document.getElementById("open-settings-btn").addEventListener("click", () => modal.classList.remove("hidden"));
      document.getElementById("close-settings-btn").addEventListener("click", () => modal.classList.add("hidden"));
      
      document.getElementById("save-settings-btn").addEventListener("click", async () => {
        const urlInput = document.getElementById("csv-url-input").value.trim();
        localStorage.setItem("bible_2027_csv_url", urlInput);
        sheetCsvUrl = urlInput;
        modal.classList.add("hidden");
        await initApp();
      });
    }

    // Start App
    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
